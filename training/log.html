<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<title>Training Log · Hyeonwoo Yang</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Noto+Serif+KR:wght@600;700&amp;display=swap">
<link rel="stylesheet" href="../assets/site.css?v=1127y">
</head>
<body data-root="../" data-page="log">
<main>
  <div class="wrap">
    <section class="hero" style="padding-bottom:8px">
      <p class="eyebrow">Training Log</p>
      <h1>훈련 <em>일지</em></h1>
      <p class="lead">Hyrox Training, 러닝, 웨이트를 한곳에 적습니다. 달력으로 한 달을 한눈에 보고, 화살표로 달을 넘겨요. 그 달의 기록은 달력 아래에 이어집니다.</p>
    </section>

    <section class="sec" style="padding-top:8px">
      <div class="banner" id="logPreview" hidden>미리보기 중이에요. 여기서 저장한 내용은 이 기기에만 남아요.</div>
      <div class="log-top">
        <div class="log-find"><input class="in" id="logSearch" type="search" enterkeyhint="search" autocomplete="off" placeholder="검색" aria-label="기록 검색"></div>
        <button class="pen-btn" id="logNew" type="button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>운동 기록</span></button>
        <span class="note" id="logHint" hidden>기록을 쓰려면 오른쪽 위 열쇠 버튼에서 입력 설정을 해주세요.</span>
      </div>

      <div class="plate" id="logFormWrap" hidden style="margin-bottom:24px">
        <h3 id="logFormTitle" style="font-size:1.15rem;font-weight:700;color:var(--ink);margin-bottom:16px">운동 기록</h3>
        <form id="logForm" autocomplete="off">
          <div class="form" id="lfMain">
            <div class="c2"><label for="lf-date">Date · 날짜</label><input class="in" id="lf-date" name="date" type="date" required></div>
            <div class="c2"><label for="lf-session">Session · 종목</label><select class="in" id="lf-session" name="session"></select></div>
            <div class="c2" data-k="hyrox weights other"><label for="lf-format">Format</label><select class="in" id="lf-format" name="format"></select></div>
            <div class="c1" data-k="run"><label for="lf-km">거리 · km</label><input class="in" id="lf-km" name="km" type="number" inputmode="decimal" step="any" min="0"></div>
            <div class="c1"><label for="lf-min">시간 · 분:초</label><input class="in" id="lf-min" name="minutes" inputmode="text" placeholder="37:54"></div>
            <div class="c1" data-k="run"><label for="lf-pace">페이스</label><input class="in" id="lf-pace" name="pace" placeholder="자동"></div>
            <div class="c1"><label for="lf-rpe">RPE · 강도</label><input class="in" id="lf-rpe" name="rpe" type="number" inputmode="decimal" step="0.5" min="1" max="10" placeholder="1–10"></div>
            <div class="c3" id="lfWorkout"><label for="lf-workout" id="lfWorkoutLabel">Workout · 운동 내용</label><textarea class="in" id="lf-workout" name="workout" placeholder="8 min × 3 sets&#10;#1 1000m Run + Max Sled Push"></textarea></div>
            <div class="c3" id="lfResult" data-k="hyrox other"><label for="lf-result">Result · 무게와 결과</label><textarea class="in" id="lf-result" name="result" placeholder="Wall ball 9kg · 3R+27"></textarea></div>
            <div class="c6"><label for="lf-notes">Notes · 느낀 점</label><textarea class="in" id="lf-notes" name="notes" style="min-height:76px" placeholder="컨디션, 힘들었던 구간, 통증"></textarea></div>
          </div>
          <details class="more" id="lfMore"><summary>심박 · 세부 내용 더 적기</summary>
            <div class="form" id="lfMoreGrid" style="margin-top:12px">
              <div class="c1"><label for="lf-avg">Avg HR</label><input class="in" id="lf-avg" name="avg_hr" type="number" inputmode="numeric" min="0"></div>
              <div class="c1"><label for="lf-max">Max HR</label><input class="in" id="lf-max" name="max_hr" type="number" inputmode="numeric" min="0"></div>
            </div>
          </details>
          <div class="form-foot"><button class="btn" id="logSave" type="submit">저장</button><button class="btn line" id="logCancel" type="button">닫기</button></div>
        </form>
      </div>
      <p class="note" id="logMsg" role="status"></p>
      <div id="logList"></div>
    </section>
  </div>
</main>
<script src="../assets/site.js?v=1127y"></script>
</body>
</html>
